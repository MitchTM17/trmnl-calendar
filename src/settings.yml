custom_fields:
- keyname: auto_scroll_enabled
  field_type: boolean
  name: Auto-Scroll Calendar Window
  description: Automatically shift the visible time range as the day progresses.
  help_text: If off, the calendar always shows the fixed Start Time-End Time range below.
  default: true
  group: Auto-Scroll Window
- keyname: auto_scroll_start
  field_type: time
  name: Start Time
  description: Start of the visible window (and, when auto-scroll is on, its first anchor point).
  default: '08:00'
  group: Auto-Scroll Window
- keyname: auto_scroll_end
  field_type: time
  name: End Time
  description: End of the visible window. (End - Start) sets the window's width.
  default: '20:00'
  group: Auto-Scroll Window
- keyname: auto_scroll_frequency
  field_type: select
  name: Rotation Frequency (hours)
  description: How often the window jumps forward. Ignored if auto-scroll is off.
  help_text: Must evenly divide 24 so it lands on the same times every day.
  default: '6'
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  - '6'
  - '8'
  - '12'
  - '24'
  group: Auto-Scroll Window
